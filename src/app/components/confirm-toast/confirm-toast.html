<!-- src/app/components/confirm-toast/confirm-toast.component.html -->
<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
  <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4 transform transition-all scale-100">
    
    <!-- Header with Icon & Title -->
    <div class="flex items-center gap-3 border-b border-slate-700/60 pb-3">
      <div [ngClass]="{
        'bg-red-500/10 text-red-400 border-red-500/20': type === 'danger',
        'bg-amber-500/10 text-amber-400 border-amber-500/20': type === 'warning',
        'bg-sky-500/10 text-sky-400 border-sky-500/20': type === 'info'
      }" class="p-2.5 rounded-lg border text-xl flex items-center justify-center">
        <span *ngIf="type === 'danger'">⚠️</span>
        <span *ngIf="type === 'warning'">🚨</span>
        <span *ngIf="type === 'info'">ℹ️</span>
      </div>
      <div>
        <h3 class="text-lg font-bold text-white leading-tight">{{ title }}</h3>
        <p class="text-xs text-slate-400">Action irréversible</p>
      </div>
    </div>

    <!-- Body Message -->
    <div class="text-sm text-slate-300 py-1">
      <p>{{ message }}</p>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-2">
      <button 
        (click)="onCancel()" 
        class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
        {{ cancelText }}
      </button>

      <button 
        (click)="onConfirm()" 
        [ngClass]="{
          'bg-red-600 hover:bg-red-500 text-white': type === 'danger',
          'bg-amber-600 hover:bg-amber-500 text-white': type === 'warning',
          'bg-sky-600 hover:bg-sky-500 text-white': type === 'info'
        }"
        class="font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-1.5 shadow-lg">
        <span>🗑️</span>
        <span>{{ confirmText }}</span>
      </button>
    </div>

  </div>
</div>
